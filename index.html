<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finbar's Photo Map</title>
  <meta name="description" content="A map of the places Finbar has photographed.">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main id="map" aria-label="Map of photographed places"></main>

  <p id="status" class="status" role="status" hidden></p>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Photo" hidden>
    <button class="viewer-close" id="viewer-close" type="button" aria-label="Close photo">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
    <button class="viewer-nav viewer-prev" id="viewer-prev" type="button" aria-label="Previous photo" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M16 5l-8 7 8 7"></path>
      </svg>
    </button>
    <button class="viewer-nav viewer-next" id="viewer-next" type="button" aria-label="Next photo" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M8 5l8 7-8 7"></path>
      </svg>
    </button>
    <figure class="viewer-body">
      <div class="viewer-frame">
        <img id="viewer-img" alt="">
        <span class="viewer-spinner" id="viewer-spinner" aria-hidden="true"></span>
      </div>
      <figcaption class="viewer-caption">
        <span id="viewer-date"></span>
        <span class="viewer-count" id="viewer-count" hidden></span>
      </figcaption>
    </figure>
    <div class="viewer-hint" id="viewer-hint" aria-hidden="true">
      <span class="viewer-hint-arrow">&lsaquo;</span>
      <span>Swipe to browse &middot; drag down to close</span>
      <span class="viewer-hint-arrow">&rsaquo;</span>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
